<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%" style="background: #070514; font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <!-- Cyan to Purple Gradient -->
    <linearGradient id="insentroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <!-- Neon Glow Effect -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(20, 15)">
    <!-- Tech Logo Symbol / Emblem -->
    <g transform="translate(10, 10)">
      <!-- Outer Hexagon Outline -->
      <polygon points="50,10 90,32 90,78 50,100 10,78 10,32" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.35" />
      
      <!-- Inner Glowing Geometric Shape -->
      <path d="M38 32 L62 32 L62 42 L55 42 L55 68 L62 68 L62 78 L38 78 L38 68 L45 68 L45 42 L38 42 Z" fill="url(#insentroGrad)" />
      
      <!-- Accent Neon Dots -->
      <circle cx="75" cy="32" r="4.5" fill="#22d3ee" filter="url(#cyanGlow)" />
      <circle cx="25" cy="78" r="3.5" fill="#c084fc" filter="url(#cyanGlow)" />
    </g>

    <!-- Brand Text -->
    <text x="130" y="72" font-weight="900" font-size="52" letter-spacing="4" fill="#FFFFFF">
      INSENTRO<tspan fill="#22d3ee" filter="url(#cyanGlow)">.</tspan>
    </text>
    
    <!-- Tagline -->
    <text x="133" y="98" font-weight="700" font-size="12" letter-spacing="6" fill="#94a3b8">
      HIGH-IMPACT DIGITAL SOLUTIONS
    </text>
  </g>
</svg>
